- name: Civitapro
  slug: civitapro
  summary: Plataforma para gerenciamento de processos de cidadania italiana.
  description: |
    O Civitapro é uma plataforma voltada para o gerenciamento de processos de cidadania italiana. O sistema organiza o acompanhamento das solicitações, reunindo informações de clientes, pedidos, status dos processos e os relacionamentos familiares envolvidos em cada caso.

    A plataforma estrutura dados de clientes, solicitações de cidadania, pedidos e o andamento dos processos. Uma parte importante do sistema é a árvore genealógica, que permite representar os vínculos familiares necessários para o acompanhamento das solicitações.

    Minha atuação foi principalmente no desenvolvimento do backend com Ruby on Rails, criando e mantendo a API consumida pelo frontend. Trabalhei na modelagem das entidades e relacionamentos, na implementação das regras de negócio, na criação de endpoints e na manutenção das funcionalidades da plataforma.

    Os testes automatizados foram escritos com RSpec, e a documentação da API foi feita com Rswag, gerando a especificação Swagger.

    Também desenvolvi uma integração com a OpenAI para tradução de mensagens. A funcionalidade foi implementada na API para facilitar a comunicação entre advogados italianos e clientes brasileiros, permitindo a tradução das mensagens do chat entre os idiomas.
  role: Desenvolvimento backend e API
  technologies:
    - Ruby
    - Ruby on Rails
    - PostgreSQL
    - RSpec
    - Rswag / Swagger
    - OpenAI API
    - API REST
  highlights:
    - Modelagem de entidades e relacionamentos, incluindo a árvore genealógica
    - API REST consumida pelo frontend
    - Testes automatizados com RSpec
    - Documentação da API com Rswag / Swagger
    - Integração com a OpenAI API para tradução de mensagens do chat
  icon: landmark
  featured: true
  position: 0

