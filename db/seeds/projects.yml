- name: Ilos Prime
  slug: ilos-prime
  summary: Plataforma de publicação e gerenciamento de conteúdos, com planos e assinaturas.
  description: |
    O Ilos Prime é uma plataforma voltada para publicação e gerenciamento de conteúdos e posts. O sistema organiza conteúdos digitais e os disponibiliza aos usuários por meio de uma plataforma web.

    Um dos principais trabalhos no projeto foi o desenvolvimento de funcionalidades relacionadas a planos e assinaturas. Foi realizada uma integração com o PagBank para o gerenciamento de assinaturas recorrentes e planos, conectando o sistema aos serviços de pagamento para a contratação e a manutenção dos planos oferecidos aos usuários.

    Minha atuação envolveu principalmente o desenvolvimento backend, a implementação das regras de negócio das assinaturas, a integração com o PagBank e a manutenção da API.
  role: Desenvolvimento backend e integração de pagamentos
  technologies:
    - Ruby
    - Ruby on Rails
    - PostgreSQL
    - API REST
    - PagBank
  highlights:
    - Publicação e gerenciamento de conteúdos e posts
    - Funcionalidades de planos e assinaturas recorrentes
