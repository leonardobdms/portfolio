- name: Ilos E-Commerce
  slug: ilos-e-commerce
  summary: Plataforma de e-commerce para gerenciamento e processamento de pedidos.
  description: |
    O Ilos E-Commerce é uma plataforma de comércio eletrônico utilizada para gerenciamento e processamento de pedidos. O sistema cobre o fluxo de compras, pedidos, clientes, produtos e checkout.

    Minha atuação envolveu principalmente o desenvolvimento backend e a implementação de integrações importantes para o checkout e para a operação do e-commerce.

    Foram implementadas integrações com PagBank e PayPal para o processamento dos pagamentos realizados durante o checkout. As integrações conectam o e-commerce aos respectivos gateways, permitindo que os pedidos sejam processados pelos serviços externos.

    Também foi realizada uma integração com a Nasajon para emissão de RPS. O sistema envia as informações necessárias para a Nasajon, que gera o RPS posteriormente utilizado na emissão da nota fiscal pelo próprio sistema da Nasajon. Trabalhei no desenvolvimento dessa integração, na comunicação com a API/serviço externo e nas regras necessárias para conectar o fluxo de pedidos ao processo de emissão de documentos fiscais.
  role: Desenvolvimento backend e integrações
  technologies:
    - Ruby
    - Ruby on Rails
    - PostgreSQL
    - API REST
    - PagBank
    - PayPal
    - Nasajon
  highlights:
    - Fluxo de compras, pedidos, clientes, produtos e checkout
    - Integração de pagamentos com PagBank e PayPal
    - Integração fiscal com a Nasajon para emissão de RPS
    - Comunicação com API/serviço externo no fluxo de pedidos
  icon: store
  featured: true
  position: 5

