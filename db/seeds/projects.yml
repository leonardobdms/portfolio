- name: Ilos CAS Auth
  slug: ilos-cas-auth
  summary: Plugin WordPress para autenticação via Ilos CAS.
  description: |
    O Ilos CAS Auth é um plugin WordPress desenvolvido para integrar o WordPress ao sistema de autenticação do Ilos CAS. O plugin permite que o ambiente WordPress utilize o mecanismo de autenticação centralizado, fazendo a comunicação entre o WordPress e a aplicação responsável pela autenticação.

    Minha atuação envolveu o desenvolvimento e a manutenção do plugin, a implementação da integração com o CAS e o tratamento do fluxo de autenticação entre as aplicações.
